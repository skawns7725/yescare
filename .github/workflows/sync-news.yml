name: Sync YesCare blog news

on:
  push:
    paths:
      - '.github/workflows/sync-news.yml'
      - 'scripts/sync-news.py'
      - 'public/news-config.json'
  schedule:
    - cron: '23 */3 * * *'
  workflow_dispatch:

concurrency:
  group: yescare-blog-news
  cancel-in-progress: false

jobs:
  sync:
    if: github.event_name == 'schedule' || github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Refresh public news data
        shell: bash
        run: |
          python3 scripts/sync-news.py > "$RUNNER_TEMP/yescare-news.json"
          blob=$(git hash-object -w "$RUNNER_TEMP/yescare-news.json")
          tree=$(printf '100644 blob %s\tnews.json\n' "$blob" | git mktree)

          branch=refs/heads/yescare-news
          remote_branch=$(git ls-remote origin "$branch")
          parent=()
          if [[ -n "$remote_branch" ]]; then
            git fetch --no-tags --depth=1 origin "$branch"
            if [[ "$(git rev-parse 'FETCH_HEAD^{tree}')" == "$tree" ]]; then
              echo "News data is up to date."
              exit 0
            fi
            parent=(-p FETCH_HEAD)
          fi

          commit=$(git -c user.name=github-actions[bot] \
            -c user.email=41898282+github-actions[bot]@users.noreply.github.com \
            commit-tree "$tree" "${parent[@]}" -m "chore: refresh YesCare blog news")
          git push origin "$commit:$branch"
